<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGradConf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redGreenBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGradConf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="goldGlowConf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowConf" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGradConf)"/>

  <!-- Ornate Golden Outer Borders -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="url(#goldGradConf)" stroke-width="3" filter="url(#goldGlowConf)"/>
  <rect x="28" y="28" width="544" height="744" rx="10" fill="none" stroke="url(#goldGradConf)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Top Badge: স্লোগান -->
  <g transform="translate(300, 52)">
    <rect x="-130" y="0" width="260" height="28" rx="14" fill="#000" opacity="0.4" stroke="url(#goldGradConf)" stroke-width="1"/>
    <text x="0" y="19" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="url(#goldGradConf)" text-anchor="middle">★ ঐক্য • শৃঙ্খলা • প্রগতি ★</text>
  </g>

  <!-- Main Headline: ঐতিহাসিক কর্মী সম্মেলন -->
  <g transform="translate(300, 125)">
    <rect x="-240" y="-35" width="480" height="52" rx="8" fill="url(#redGreenBanner)" stroke="url(#goldGradConf)" stroke-width="1.5" filter="url(#shadowConf)"/>
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">তৃণমূল কর্মী সম্মেলন ও সমাবেশ</text>
    <text x="0" y="38" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="700" fill="url(#goldGradConf)" text-anchor="middle">দেশ গড়ার প্রত্যয়ে একতাবদ্ধ হোন</text>
    <line x1="-130" y1="52" x2="130" y2="52" stroke="url(#goldGradConf)" stroke-width="1"/>
  </g>

  <!-- Multi Leader Photo Arrangement (Chief Guest + Leaders) -->
  <g transform="translate(300, 330)">
    <!-- Center Chief Guest Frame -->
    <g transform="translate(0, 0)">
      <ellipse cx="0" cy="0" rx="80" ry="98" fill="#f59e0b" opacity="0.2" filter="url(#goldGlowConf)"/>
      <path d="M-70,75 L-70,-30 A70,70 0 0,1 70,-30 L70,75 Z" fill="#0f172a" stroke="url(#goldGradConf)" stroke-width="3.5" filter="url(#shadowConf)"/>
      <path d="M-64,70 L-64,-30 A64,64 0 0,1 64,-30 L64,70 Z" fill="#1e293b"/>
      <circle cx="0" cy="-10" r="28" fill="#334155"/>
      <path d="M-40,65 C-40,25 40,25 40,65 Z" fill="#334155"/>
      <text x="0" y="70" font-family="'Hind Siliguri', sans-serif" font-size="10" font-weight="bold" fill="url(#goldGradConf)" text-anchor="middle">প্রধান অতিথি</text>
    </g>

    <!-- Left Flank Leader -->
    <g transform="translate(-140, 25)">
      <path d="M-45,50 L-45,-20 A45,45 0 0,1 45,-20 L45,50 Z" fill="#0f172a" stroke="url(#goldGradConf)" stroke-width="2"/>
      <path d="M-40,46 L-40,-20 A40,40 0 0,1 40,-20 L40,46 Z" fill="#1e293b"/>
      <circle cx="0" cy="-6" r="18" fill="#334155"/>
      <path d="M-25,42 C-25,15 25,15 25,42 Z" fill="#334155"/>
      <text x="0" y="47" font-family="'Hind Siliguri', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">বিশেষ অতিথি</text>
    </g>

    <!-- Right Flank Leader -->
    <g transform="translate(140, 25)">
      <path d="M-45,50 L-45,-20 A45,45 0 0,1 45,-20 L45,50 Z" fill="#0f172a" stroke="url(#goldGradConf)" stroke-width="2"/>
      <path d="M-40,46 L-40,-20 A40,40 0 0,1 40,-20 L40,46 Z" fill="#1e293b"/>
      <circle cx="0" cy="-6" r="18" fill="#334155"/>
      <path d="M-25,42 C-25,15 25,15 25,42 Z" fill="#334155"/>
      <text x="0" y="47" font-family="'Hind Siliguri', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">বিশেষ অতিথি</text>
    </g>
  </g>

  <!-- Conference Details Box (Date, Time, Location) -->
  <g transform="translate(300, 485)">
    <rect x="-210" y="-15" width="420" height="50" rx="8" fill="#030712" opacity="0.6" stroke="url(#goldGradConf)" stroke-width="1.5"/>
    <text x="-120" y="15" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">📅 তারিখ: ২৫ ডিসেম্বর</text>
    <text x="10" y="15" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">⏰ সময়: সকাল ১০:০০ টা</text>
    <text x="0" y="27" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="url(#goldGradConf)" text-anchor="middle">📍 স্থান: ঐতিহাসিক কেন্দ্রীয় ঈদগাহ ময়দান</text>
  </g>

  <!-- Candidate / Organizer Name -->
  <g transform="translate(300, 580)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadowConf)">মোঃ তারেক মাহমুদ</text>
    <rect x="-140" y="10" width="280" height="24" rx="4" fill="#000" opacity="0.4"/>
    <text x="0" y="27" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#ffd54f" text-anchor="middle">আহ্বায়ক, সম্মেলন প্রস্তুতি কমিটি</text>
    <text x="0" y="52" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">সম্মেলন সফল ও সার্থক করতে সকলে দলে দলে যোগ দিন</text>
  </g>

  <!-- Bottom Promotional Ribbon Footer -->
  <g transform="translate(300, 725)">
    <rect x="-240" y="-18" width="480" height="36" rx="6" fill="url(#goldGradConf)" filter="url(#shadowConf)"/>
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="900" fill="#1e1b4b" text-anchor="middle">আহ্বানে: সম্মেলন প্রস্তুতি কমিটি ও সর্বস্তরের সচেতন কর্মীবৃন্দ</text>
  </g>
</svg>
