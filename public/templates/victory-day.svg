<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f14"/>
      <stop offset="50%" stop-color="#004d2c"/>
      <stop offset="100%" stop-color="#01140d"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="70%" stop-color="#e61025"/>
      <stop offset="100%" stop-color="#aa0515"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="40%" stop-color="#f5b324"/>
      <stop offset="80%" stop-color="#c98a0c"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="50%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Sunburst Rays -->
  <g opacity="0.08" stroke="#fff" stroke-width="2">
    <line x1="300" y1="240" x2="0" y2="0"/>
    <line x1="300" y1="240" x2="150" y2="0"/>
    <line x1="300" y1="240" x2="300" y2="0"/>
    <line x1="300" y1="240" x2="450" y2="0"/>
    <line x1="300" y1="240" x2="600" y2="0"/>
    <line x1="300" y1="240" x2="600" y2="200"/>
    <line x1="300" y1="240" x2="600" y2="400"/>
    <line x1="300" y1="240" x2="0" y2="200"/>
    <line x1="300" y1="240" x2="0" y2="400"/>
  </g>

  <!-- Red Sun Circle of Freedom -->
  <circle cx="300" cy="245" r="140" fill="url(#sunGrad)" filter="url(#shadow)"/>

  <!-- Stylized National Monument (স্মৃতিসৌধ) Silhouette -->
  <g fill="#021f14" opacity="0.95">
    <!-- Center Highest Triangle -->
    <polygon points="300,105 288,275 312,275"/>
    <polygon points="300,105 284,275 300,275" fill="#01140d"/>
    <!-- Tier 2 -->
    <polygon points="300,130 268,275 286,275"/>
    <polygon points="300,130 314,275 332,275"/>
    <!-- Tier 3 -->
    <polygon points="300,160 248,275 266,275"/>
    <polygon points="300,160 334,275 352,275"/>
    <!-- Tier 4 -->
    <polygon points="300,190 226,275 246,275"/>
    <polygon points="300,190 354,275 374,275"/>
    <!-- Monument Base -->
    <rect x="200" y="272" width="200" height="8" rx="2" fill="#01140d"/>
  </g>

  <!-- Ornate Golden Borders -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <rect x="28" y="28" width="544" height="744" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Golden Corner Filigrees -->
  <!-- Top-Left -->
  <path d="M28 65 L28 28 L65 28" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="45" cy="45" r="4" fill="url(#goldGrad)"/>
  <!-- Top-Right -->
  <path d="M572 65 L572 28 L535 28" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="555" cy="45" r="4" fill="url(#goldGrad)"/>
  <!-- Bottom-Left -->
  <path d="M28 735 L28 772 L65 772" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="45" cy="755" r="4" fill="url(#goldGrad)"/>
  <!-- Bottom-Right -->
  <path d="M572 735 L572 772 L535 772" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="555" cy="755" r="4" fill="url(#goldGrad)"/>

  <!-- Top Badge: ১৬ই ডিসেম্বর -->
  <g transform="translate(300, 52)">
    <rect x="-95" y="0" width="190" height="32" rx="16" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <text x="0" y="21" font-family="'Hind Siliguri', 'Noto Serif Bengali', sans-serif" font-size="15" font-weight="bold" fill="#021f14" text-anchor="middle" letter-spacing="1">★ ১৬ই ডিসেম্বর ★</text>
  </g>

  <!-- Header Headline: মহান বিজয় দিবস -->
  <text x="300" y="340" font-family="'Noto Serif Bengali', 'Hind Siliguri', serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">মহান বিজয় দিবস</text>
  <text x="300" y="372" font-family="'Hind Siliguri', sans-serif" font-size="17" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.5">বীর মুক্তিযোদ্ধা ও সকল শহীদদের প্রতি বিনম্র শ্রদ্ধাঞ্জলি</text>

  <!-- Center Decorative Divider -->
  <g transform="translate(300, 392)">
    <line x1="-160" y1="0" x2="-25" y2="0" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#goldGrad)"/>
    <line x1="25" y1="0" x2="160" y2="0" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Candidate Photo Arched Frame Placeholder -->
  <g transform="translate(300, 500)">
    <!-- Halo glow -->
    <ellipse cx="0" cy="0" rx="90" ry="105" fill="#f5b324" opacity="0.2" filter="url(#goldGlow)"/>
    <!-- Photo Frame Outer Border -->
    <path d="M-75,80 L-75,-25 A75,75 0 0,1 75,-25 L75,80 Z" fill="#021f14" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
    <!-- Inner Frame with avatar silhouette -->
    <path d="M-68,75 L-68,-25 A68,68 0 0,1 68,-25 L68,75 Z" fill="#063321"/>
    <!-- Leader Silhouette -->
    <circle cx="0" cy="-5" r="30" fill="#0a5235"/>
    <path d="M-45,65 C-45,30 45,30 45,65 Z" fill="#0a5235"/>
    <text x="0" y="72" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="600" fill="#ffd54f" text-anchor="middle">নেতৃত্বের ছবি</text>
    <!-- Frame Ribbon Bottom Accent -->
    <polygon points="-85,85 0,78 85,85 0,92" fill="url(#goldGrad)"/>
  </g>

  <!-- Candidate Name & Designation Banner -->
  <g transform="translate(300, 642)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">প্রার্থীর নাম এখানে বসবে</text>
    <rect x="-130" y="10" width="260" height="24" rx="4" fill="#000" opacity="0.4"/>
    <text x="0" y="27" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="600" fill="#ffd54f" text-anchor="middle">পদবী ও রাজনৈতিক দলের নাম</text>
  </g>

  <!-- Bottom Promotional Ribbon Footer -->
  <g transform="translate(300, 715)">
    <path d="M-240,-16 L240,-16 L225,16 L-225,16 Z" fill="url(#ribbonGrad)" filter="url(#shadow)"/>
    <rect x="-225" y="-16" width="450" height="32" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">শুভেচ্ছান্তে: সর্বস্তরের দেশপ্রেমিক জনগণ</text>
  </g>
</svg>
