<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGradCond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#cbd5e1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowCond" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGradCond)"/>
  <rect width="600" height="800" fill="url(#candleGlow)"/>

  <!-- Ornate Silver Outer Borders -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="url(#silverGrad)" stroke-width="2.5" filter="url(#silverGlow)"/>
  <rect x="28" y="28" width="544" height="744" rx="10" fill="none" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Corner Filigree -->
  <g stroke="url(#silverGrad)" stroke-width="2" fill="none">
    <path d="M30 65 L30 30 L65 30"/>
    <path d="M570 65 L570 30 L535 30"/>
    <path d="M30 735 L30 770 L65 770"/>
    <path d="M570 735 L570 770 L535 770"/>
  </g>

  <!-- Top Ribbon Banner: ইন্না লিল্লাহি ওয়া ইন্না ইলাইহি রাজিউন -->
  <g transform="translate(300, 56)">
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="#000000" opacity="0.5" stroke="url(#silverGrad)" stroke-width="1"/>
    <text x="0" y="19" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ</text>
  </g>

  <!-- Candle Flame Motif -->
  <g transform="translate(300, 120)">
    <!-- Candle body -->
    <rect x="-8" y="15" width="16" height="40" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <!-- Wick -->
    <line x1="0" y1="15" x2="0" y2="8" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Flame Outer Glow -->
    <ellipse cx="0" cy="-3" rx="12" ry="18" fill="#fef08a" opacity="0.3" filter="url(#silverGlow)"/>
    <!-- Flame Core -->
    <path d="M0,-14 C7,-5 7,6 0,8 C-7,6 -7,-5 0,-14 Z" fill="#fef08a"/>
    <path d="M0,-8 C3,-3 3,4 0,5 C-3,4 -3,-3 0,-8 Z" fill="#ffffff"/>
  </g>

  <!-- Headline: বিনম্র শ্রদ্ধাঞ্জলি -->
  <g transform="translate(300, 215)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="44" font-weight="900" fill="url(#silverGrad)" text-anchor="middle" filter="url(#shadowCond)">বিনম্র শ্রদ্ধাঞ্জলি</text>
    <text x="0" y="30" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">ও গভীর শোক প্রকাশ</text>
    <line x1="-120" y1="44" x2="120" y2="44" stroke="url(#silverGrad)" stroke-width="1"/>
  </g>

  <!-- Remembered Person Portrait Frame -->
  <g transform="translate(300, 395)">
    <!-- Outer Frame -->
    <ellipse cx="0" cy="0" rx="85" ry="105" fill="#0b0f17" stroke="url(#silverGrad)" stroke-width="4" filter="url(#shadowCond)"/>
    <ellipse cx="0" cy="0" rx="77" ry="97" fill="#1e293b"/>
    <!-- Silhouette -->
    <circle cx="0" cy="-15" r="34" fill="#334155"/>
    <path d="M-48,70 C-48,25 48,25 48,70 Z" fill="#334155"/>
    <text x="0" y="80" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">স্মরণীয় ব্যক্তিত্বের ছবি</text>
    <!-- Black Mourning Ribbon Across Corner -->
    <path d="M-72,-50 L-50,-72 L-30,-52 L-52,-30 Z" fill="#000000" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Person Name & Dignity Title -->
  <g transform="translate(300, 545)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadowCond)">মরহুম আলহাজ্ব শামসুল হক</text>
    <rect x="-140" y="10" width="280" height="24" rx="4" fill="#000" opacity="0.4"/>
    <text x="0" y="27" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">সাবেক সভাপতি ও প্রবীণ রাজনীতিক</text>
  </g>

  <!-- Condolence Message Box -->
  <g transform="translate(300, 630)">
    <rect x="-220" y="-20" width="440" height="52" rx="8" fill="#000" opacity="0.5" stroke="url(#silverGrad)" stroke-width="0.8"/>
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">আমরা তাঁর বিদেহী আত্মার মাগফিরাত ও চিরশান্তি কামনা করি।</text>
    <text x="0" y="20" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="url(#silverGrad)" text-anchor="middle">শোকসন্তপ্ত পরিবারের প্রতি আমাদের গভীর সমবেদনা জ্ঞাপন করছি।</text>
  </g>

  <!-- Bottom Promotional Ribbon Footer -->
  <g transform="translate(300, 725)">
    <rect x="-240" y="-18" width="480" height="36" rx="6" fill="#1e293b" stroke="url(#silverGrad)" stroke-width="1.5" filter="url(#shadowCond)"/>
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">শোকান্তে: সর্বস্তরের শোকার্ত নেতাকর্মী ও এলাকাবাসী</text>
  </g>
</svg>
