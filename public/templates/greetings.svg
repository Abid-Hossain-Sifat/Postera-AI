<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGradGreet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="45%" stop-color="#551270"/>
      <stop offset="85%" stop-color="#3b094e"/>
      <stop offset="100%" stop-color="#19032b"/>
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#551270" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradGreet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="goldGlowGreet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowGreet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGradGreet)"/>
  <rect width="600" height="800" fill="url(#sparkleGlow)"/>

  <!-- Celebratory Sparkles & Stars -->
  <g fill="url(#goldGradGreet)" opacity="0.6">
    <polygon points="120,80 123,88 131,91 123,94 120,102 117,94 109,91 117,88"/>
    <polygon points="480,90 483,97 490,100 483,103 480,110 477,103 470,100 477,97"/>
    <polygon points="90,260 92,265 97,267 92,269 90,274 88,269 83,267 88,265"/>
    <polygon points="510,240 513,246 519,248 513,250 510,256 507,250 501,248 507,246"/>
    <polygon points="140,420 142,425 147,427 142,429 140,434 138,429 133,427 138,425"/>
    <polygon points="460,440 462,445 467,447 462,449 460,454 458,449 453,447 458,445"/>
  </g>

  <!-- Ornate Golden Outer Borders -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="url(#goldGradGreet)" stroke-width="3" filter="url(#goldGlowGreet)"/>
  <rect x="28" y="28" width="544" height="744" rx="10" fill="none" stroke="url(#goldGradGreet)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Golden Filigree Corners -->
  <g stroke="url(#goldGradGreet)" stroke-width="2" fill="none">
    <path d="M30 65 L30 30 L65 30"/>
    <circle cx="45" cy="45" r="3" fill="url(#goldGradGreet)"/>
    <path d="M570 65 L570 30 L535 30"/>
    <circle cx="555" cy="45" r="3" fill="url(#goldGradGreet)"/>
    <path d="M30 735 L30 770 L65 770"/>
    <circle cx="45" cy="755" r="3" fill="url(#goldGradGreet)"/>
    <path d="M570 735 L570 770 L535 770"/>
    <circle cx="555" cy="755" r="3" fill="url(#goldGradGreet)"/>
  </g>

  <!-- Top Badge: ৫টি তারকা ক্রেস্ট -->
  <g transform="translate(300, 52)">
    <rect x="-110" y="0" width="220" height="28" rx="14" fill="#000000" opacity="0.4" stroke="url(#goldGradGreet)" stroke-width="1"/>
    <text x="0" y="19" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="url(#goldGradGreet)" text-anchor="middle">★ ★ ★ ★ ★</text>
  </g>

  <!-- Main Headline: শুভেচ্ছা ও অভিনন্দন -->
  <g transform="translate(300, 125)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadowGreet)">শুভেচ্ছা ও অভিনন্দন</text>
    <text x="0" y="30" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="700" fill="url(#goldGradGreet)" text-anchor="middle">নতুন দায়িত্ব ও গৌরবময় পথচলায় আন্তরিক শুভকামনা</text>
    <line x1="-140" y1="45" x2="140" y2="45" stroke="url(#goldGradGreet)" stroke-width="1.5"/>
  </g>

  <!-- Candidate Portrait Frame -->
  <g transform="translate(300, 340)">
    <!-- Golden Halo Glow -->
    <ellipse cx="0" cy="0" rx="95" ry="115" fill="#fde047" opacity="0.2" filter="url(#goldGlowGreet)"/>
    <!-- Outer Arched Frame -->
    <path d="M-85,85 L-85,-35 A85,85 0 0,1 85,-35 L85,85 Z" fill="#200535" stroke="url(#goldGradGreet)" stroke-width="4" filter="url(#shadowGreet)"/>
    <!-- Inner Base -->
    <path d="M-78,80 L-78,-35 A78,78 0 0,1 78,-35 L78,80 Z" fill="#3b094e"/>
    <!-- Silhouette -->
    <circle cx="0" cy="-10" r="32" fill="#581673"/>
    <path d="M-45,70 C-45,25 45,25 45,70 Z" fill="#581673"/>
    <text x="0" y="78" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="bold" fill="url(#goldGradGreet)" text-anchor="middle">নেতা / প্রার্থীর ছবি</text>
  </g>

  <!-- Candidate Name & Designation -->
  <g transform="translate(300, 510)">
    <text x="0" y="0" font-family="'Noto Serif Bengali', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadowGreet)">ব্যারিস্টার তানভীর আহমেদ</text>
    <rect x="-140" y="10" width="280" height="24" rx="4" fill="#000" opacity="0.4"/>
    <text x="0" y="27" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#ffd54f" text-anchor="middle">নব-নির্বাচিত সাধারণ সম্পাদক</text>
    <text x="0" y="52" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">মহানগর যুব সংগঠন ও সামাজিক ফোরাম</text>
  </g>

  <!-- Congratulations Message Box -->
  <g transform="translate(300, 620)">
    <rect x="-220" y="-18" width="440" height="48" rx="8" fill="#000" opacity="0.4" stroke="url(#goldGradGreet)" stroke-width="1"/>
    <text x="0" y="3" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">&ldquo;আপনার বলিষ্ঠ নেতৃত্বে সংগঠন এগিয়ে যাক বহুদূর&rdquo;</text>
    <text x="0" y="22" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="bold" fill="url(#goldGradGreet)" text-anchor="middle">আমরা আপনার সর্বাঙ্গীন সাফল্য ও দীর্ঘায়ু কামনা করি।</text>
  </g>

  <!-- Bottom Promotional Ribbon Footer -->
  <g transform="translate(300, 725)">
    <rect x="-240" y="-18" width="480" height="36" rx="6" fill="url(#goldGradGreet)" filter="url(#shadowGreet)"/>
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="900" fill="#2a0845" text-anchor="middle">শুভেচ্ছান্তে: সর্বস্তরের শুভাকাঙ্ক্ষী ও কর্মীবৃন্দ</text>
  </g>
</svg>
